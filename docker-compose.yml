services:
  backend:
    build: .
    container_name: mintly_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mintly_network

  frontend:
    build: ./frontend
    container_name: mintly_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://backend:8000/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mintly_network

  dash:
    build: .
    container_name: mintly_dash
    command: python run_dash_standalone.py
    ports:
      - "8050:8050"
    volumes:
      - ./run_dash_standalone.py:/app/run_dash_standalone.py
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_API_URL=http://backend:8000/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mintly_network

networks:
  mintly_network:
    driver: bridge

