<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mintly - Personal Budgeting{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>💰 Mintly</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="/" class="nav-link">Upload</a></li>
                <li><a href="/transactions" class="nav-link">Transactions</a></li>
                <li><a href="/reports" class="nav-link">Reports</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Mintly. Track your spending, save your future.</p>
        </div>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
